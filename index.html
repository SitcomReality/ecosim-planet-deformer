<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoSim: Planet Deformer</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <header>
            <h1>🌍 Planet Deformer</h1>
            <p>Shape the world and simulate liquid flows</p>
        </header>

        <div id="ui-overlay">
            <div class="mode-selector">
                <button id="btn-edit" class="active" data-mode="edit">🎨 Edit Terrain</button>
                <button id="btn-flow" data-mode="flow">💧 Flow Path</button>
                <button id="btn-spring" data-mode="spring">🌊 Spring</button>
                <button id="btn-volcano" data-mode="volcano">🌋 Volcano</button>
            </div>

            <div id="edit-controls" class="sub-controls">
                <button id="btn-add" class="active" data-tool="add">⛰️ Add Mountain</button>
                <button id="btn-remove" data-tool="remove">🏔️ Remove Ground</button>
            </div>

            <div id="intensity-controls" class="sub-controls hidden">
                <div class="slider-group">
                    <label id="intensity-label" for="intensity-slider">Intensity</label>
                    <input type="range" id="intensity-slider" min="0.5" max="3" step="0.1" value="1.0">
                    <span id="intensity-value">1.0</span>
                </div>
            </div>
        </div>

        <div id="canvas-container"></div>

        <div class="instructions">
            <p><strong>Edit:</strong> Drag to sculpt terrain</p>
            <p><strong>Flow:</strong> Click to trace a path</p>
            <p><strong>Spring/Volcano:</strong> Click to start a continuous flow</p>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
